<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0D0B1E" />
    <title></title>

    <!-- 站点配置（标题 / 图标）启动脚本，沿用云端 website_config -->
    <script>
      (function () {
        function applyRoundedFavicon(source) {
          if (!source) return;
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function () {
            try {
              var size = 64;
              var radius = 14;
              var canvas = document.createElement('canvas');
              canvas.width = size;
              canvas.height = size;
              var ctx = canvas.getContext('2d');
              if (!ctx) return;
              ctx.beginPath();
              ctx.moveTo(radius, 0);
              ctx.lineTo(size - radius, 0);
              ctx.quadraticCurveTo(size, 0, size, radius);
              ctx.lineTo(size, size - radius);
              ctx.quadraticCurveTo(size, size, size - radius, size);
              ctx.lineTo(radius, size);
              ctx.quadraticCurveTo(0, size, 0, size - radius);
              ctx.lineTo(0, radius);
              ctx.quadraticCurveTo(0, 0, radius, 0);
              ctx.closePath();
              ctx.clip();
              ctx.drawImage(img, 0, 0, size, size);
              var favicon = document.querySelector('link[rel="icon"]');
              if (favicon) favicon.href = canvas.toDataURL('image/png');
            } catch (e) {}
          };
          img.onerror = function () {
            var favicon = document.querySelector('link[rel="icon"]');
            if (favicon) favicon.href = source;
          };
          img.src = source;
        }

        try {
          const saved = localStorage.getItem('cloudnav_site_settings');
          let settings = saved ? JSON.parse(saved) : null;
          if (!settings) {
            const req = new XMLHttpRequest();
            req.open('GET', '/api/storage?getConfig=website', false);
            req.send(null);
            if (req.status >= 200 && req.status < 300 && req.responseText) {
              settings = JSON.parse(req.responseText);
              localStorage.setItem('cloudnav_site_settings', JSON.stringify(settings));
            }
          }
          if (settings && settings.title) document.title = settings.title;
          if (settings && settings.favicon) applyRoundedFavicon(settings.favicon);
        } catch (e) {}
      })();
    </script>

    <style>
      :root {
        --bg: #0d0b1e;
        --fg: #f4f3ff;
        --muted: rgba(244, 243, 255, 0.55);
        --dim: rgba(244, 243, 255, 0.35);
        --line: rgba(165, 180, 252, 0.26);
        --line-strong: rgba(165, 180, 252, 0.55);
        --card: rgba(255, 255, 255, 0.06);
        --card-hover: rgba(255, 255, 255, 0.09);
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
        color: var(--fg);
        background-color: var(--bg);
        /* 静态极光渐变（不做任何漂移动画） */
        background-image:
          radial-gradient(60% 72% at 15% 0%, rgba(52, 211, 153, 0.20), transparent 62%),
          radial-gradient(55% 68% at 85% 12%, rgba(129, 140, 248, 0.26), transparent 62%),
          radial-gradient(62% 58% at 50% 112%, rgba(236, 72, 153, 0.14), transparent 60%);
        background-attachment: fixed;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }

      .top {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(13, 11, 30, 0.86);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--line);
      }

      .header-in {
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px 20px;
      }

      .brand {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      .search {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .search .ico-search {
        position: absolute;
        left: 12px;
        opacity: 0.45;
        pointer-events: none;
        display: flex;
      }

      #q {
        width: 100%;
        padding: 9px 38px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--fg);
        font-size: 16px;
        outline: none;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
      }

      #q::placeholder { color: var(--dim); }
      #q::-webkit-search-cancel-button { display: none; }

      #q:focus {
        border-color: var(--line-strong);
        box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.12);
      }

      .clear {
        position: absolute;
        right: 8px;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        padding: 6px;
        display: none;
        font-family: inherit;
      }

      .clear:hover { color: var(--fg); }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--fg);
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }

      .btn:hover { background: rgba(255, 255, 255, 0.10); }

      .btn.danger {
        color: #fda4af;
        border-color: rgba(253, 164, 175, 0.35);
      }

      .btn.danger:hover {
        background: rgba(253, 164, 175, 0.10);
        border-color: rgba(253, 164, 175, 0.6);
      }

      .chips-wrap {
        position: relative;
        max-width: 1180px;
        margin: 0 auto;
      }

      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 34px;
        scrollbar-width: none;
      }

      .scrolly {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: rgba(13, 11, 30, 0.92);
        color: var(--muted);
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
      }

      .scrolly.show { display: flex; }
      .scrolly:hover { color: var(--fg); border-color: var(--line-strong); }
      .scrolly.l { left: 4px; }
      .scrolly.r { right: 4px; }

      @media (max-width: 640px) {
        .scrolly { display: none !important; }
      }

      .chips::-webkit-scrollbar { display: none; }

      .chip {
        flex: 0 0 auto;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
      }

      .chip:hover { color: var(--fg); background: rgba(255, 255, 255, 0.08); }

      .chip.on {
        color: var(--fg);
        background: rgba(255, 255, 255, 0.10);
        border-color: var(--line);
      }

      .chip .n {
        font-size: 11px;
        opacity: 0.55;
        margin-left: 6px;
        font-variant-numeric: tabular-nums;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 18px 20px 64px;
      }

      .count {
        color: var(--muted);
        font-size: 12px;
        margin: 2px 2px 12px;
        min-height: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
      }

      .card {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        text-decoration: none;
        color: inherit;
        /* 动效仅此一处：hover 上浮 + 边框提亮 */
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: var(--line-strong);
        background: var(--card-hover);
      }

      /* 动效仅此一处：搜索过滤淡入 */
      .card.filter-in { animation: fadeUp 0.18s ease-out both; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .card { transition: none; }
        .card:hover { transform: none; }
        .card.filter-in { animation: none; }
      }

      .ico {
        width: 84px;
        height: 84px;
        flex: 0 0 84px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(52, 211, 153, 0.16), rgba(129, 140, 248, 0.30));
        border: 1px solid rgba(165, 180, 252, 0.18);
        overflow: hidden;
        font-weight: 600;
        font-size: 28px;
        color: var(--fg);
      }

      .ico img { width: 48px; height: 48px; object-fit: contain; }

      .ico .fb {
        display: none;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-size: 28px;
      }

      .body { min-width: 0; flex: 1; }

      .t {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .d {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .desc {
        font-size: 12px;
        line-height: 1.5;
        color: rgba(244, 243, 255, 0.62);
        margin-top: 7px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
        align-items: center;
      }

      .tag {
        font-size: 11px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(165, 180, 252, 0.16);
        color: var(--muted);
        white-space: nowrap;
      }

      .tag.cat {
        color: var(--fg);
        background: linear-gradient(135deg, rgba(52, 211, 153, 0.14), rgba(129, 140, 248, 0.22));
        border-color: rgba(165, 180, 252, 0.28);
      }

      .go {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--fg);
        white-space: nowrap;
        text-decoration: none;
      }

      .tools {
        margin-left: auto;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }

      .move {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }

      .move:hover { color: var(--fg); border-color: var(--line-strong); }

      .del {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }

      .del:hover { color: #fda4af; border-color: rgba(253, 164, 175, 0.5); }

      .card:focus-visible {
        outline: 2px solid var(--line-strong);
        outline-offset: 2px;
      }

      .card.dragging { opacity: 0.45; }

      .chip.drop-over {
        color: var(--fg);
        background: rgba(165, 180, 252, 0.18);
        border-color: var(--line-strong);
        outline: 2px dashed var(--line-strong);
        outline-offset: 2px;
      }

      .card:hover .go {
        border-color: var(--line-strong);
        background: rgba(255, 255, 255, 0.10);
      }

      .empty {
        text-align: center;
        padding: 90px 0;
        color: var(--muted);
        font-size: 13px;
      }

      #login,
      #catModal,
      #moveModal,
      #renameModal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(13, 11, 30, 0.86);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }

      #login[hidden],
      #catModal[hidden],
      #moveModal[hidden],
      #renameModal[hidden] { display: none; }

      .lc {
        width: min(360px, 88vw);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .lc h2 { margin: 0; font-size: 16px; font-weight: 600; }

      .lc p { margin: 0; font-size: 12px; color: var(--muted); }

      .lc input {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--fg);
        font-size: 16px;
        outline: none;
        font-family: inherit;
      }

      .lc input:focus {
        border-color: var(--line-strong);
        box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.12);
      }

      .lc select {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--fg);
        font-size: 14px;
        outline: none;
        font-family: inherit;
      }

      .lc select option {
        background: #16132b;
        color: #f4f3ff;
      }

      .lc .err { font-size: 12px; color: #fda4af; min-height: 16px; }

      .lc .btn { justify-content: center; padding: 10px; font-size: 14px; }

      @media (max-width: 640px) {
        .header-in { padding: 10px 14px; gap: 10px; }
        .brand { font-size: 13px; }
        .chips { padding: 8px 14px; }
        main { padding: 14px 14px 56px; }
        .grid { grid-template-columns: 1fr; }
        .btn .lbl { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="header-in">
        <div class="brand" id="brand">LINGYING</div>
        <div class="search">
          <span class="ico-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f4f3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
          </span>
          <input id="q" type="search" placeholder="搜索名称 / 域名 / 描述" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button class="clear" id="clear" type="button" aria-label="清空搜索">✕</button>
        </div>
        <button class="btn" id="exportBtn" type="button" title="导出 JSON">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span class="lbl">导出</span>
        </button>
        <button class="btn" id="addCatBtn" type="button" title="新建分类">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="lbl">分类</span>
        </button>
      </div>
      <nav class="chips-wrap">
        <button class="scrolly l" id="chipsLeft" type="button" aria-label="向左滚动分类" title="向左">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="chips" id="chips"></div>
        <button class="scrolly r" id="chipsRight" type="button" aria-label="向右滚动分类" title="向右">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </nav>
    </div>

    <main>
      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>没有匹配的书签</div>
    </main>

    <div id="login" hidden>
      <form class="lc" id="loginForm" autocomplete="on">
        <h2>访问密码</h2>
        <p>输入密码以查看书签</p>
        <input id="pwd" type="password" autocomplete="current-password" placeholder="密码" />
        <div class="err" id="loginErr"></div>
        <button class="btn" id="loginBtn" type="submit">进入</button>
      </form>
    </div>

    <div id="catModal" hidden>
      <form class="lc" id="catForm" autocomplete="off">
        <h2>新建分类</h2>
        <p>创建后会出现在顶部导航，可随时把书签移进来</p>
        <input id="catName" maxlength="20" placeholder="例如：待读、工作待办" />
        <div class="err" id="catErr"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" id="catCancel" type="button">取消</button>
          <button class="btn" id="catCreate" type="submit">创建</button>
        </div>
      </form>
    </div>

    <div id="moveModal" hidden>
      <form class="lc" id="moveForm">
        <h2>移动到分类</h2>
        <p id="moveLinkName"></p>
        <select id="moveTarget"></select>
        <div class="err" id="moveErr"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" id="moveCancel" type="button">取消</button>
          <button class="btn" id="moveConfirm" type="submit">移动</button>
        </div>
      </form>
    </div>

        <div id="renameModal" hidden>
      <form class="lc" id="renameForm" autocomplete="off">
        <h2>重命名分类</h2>
        <p>只改显示名称，里面的书签不受影响</p>
        <input id="renameName" maxlength="20" />
        <div class="err" id="renameErr"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center">
          <button class="btn danger" id="renameDelete" type="button" style="margin-right:auto">删除分类</button>
          <button class="btn" id="renameCancel" type="button">取消</button>
          <button class="btn" id="renameSave" type="submit">保存</button>
        </div>
      </form>
    </div>

    <script type="module">
      const $ = (sel, root = document) => root.querySelector(sel);

      const state = {
        links: [],
        categories: [],
        active: 'all',
        q: '',
        movingId: null,
        pwd: localStorage.getItem('cn_pwd') || '',
        issued: localStorage.getItem('cn_pwd_at') || ''
      };

      const els = {
        brand: $('#brand'),
        q: $('#q'),
        clear: $('#clear'),
        grid: $('#grid'),
        chips: $('#chips'),
        chipsLeft: $('#chipsLeft'),
        chipsRight: $('#chipsRight'),
        count: $('#count'),
        empty: $('#empty'),
        exportBtn: $('#exportBtn'),
        login: $('#login'),
        pwd: $('#pwd'),
        loginErr: $('#loginErr'),
        loginForm: $('#loginForm'),
        loginBtn: $('#loginBtn'),
        addCatBtn: $('#addCatBtn'),
        catModal: $('#catModal'),
        catForm: $('#catForm'),
        catName: $('#catName'),
        catErr: $('#catErr'),
        catCancel: $('#catCancel'),
        moveModal: $('#moveModal'),
        moveForm: $('#moveForm'),
        moveTarget: $('#moveTarget'),
        moveErr: $('#moveErr'),
        moveLinkName: $('#moveLinkName'),
        moveCancel: $('#moveCancel'),
        renameModal: $('#renameModal'),
        renameForm: $('#renameForm'),
        renameName: $('#renameName'),
        renameErr: $('#renameErr'),
        renameCancel: $('#renameCancel'),
        renameDelete: $('#renameDelete')
      };

      const esc = (s) =>
        String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

      function host(url) {
        try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
      }

      function fallbackChar(link) {
        const t = (link.title || '').trim();
        const first = t ? Array.from(t)[0] : '';
        if (first) return /[a-z]/.test(first) ? first.toUpperCase() : first;
        const h = host(link.url);
        return h ? h.charAt(0).toUpperCase() : '书';
      }

      function authHeaders() {
        const h = {};
        if (state.pwd) h['x-auth-password'] = state.pwd;
        if (state.pwd && state.issued) h['x-auth-issued-at'] = state.issued;
        return h;
      }

      function showLogin(message) {
        els.login.hidden = false;
        els.loginErr.textContent = message || '';
        setTimeout(() => { try { els.pwd.focus(); } catch (e) {} }, 30);
      }

      function hideLogin() {
        els.login.hidden = true;
        els.loginErr.textContent = '';
        els.pwd.value = '';
      }

      async function load() {
        els.count.textContent = '加载中…';
        els.grid.innerHTML = '';
        els.empty.hidden = true;
        try {
          const res = await fetch('/api/storage', { headers: authHeaders() });
          if (res.status === 401) {
            showLogin('密码错误或已过期，请重新输入');
            return;
          }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          state.links = Array.isArray(data.links) ? data.links : [];
          state.categories = Array.isArray(data.categories) ? data.categories : [];
          hideLogin();
          renderChips();
          renderCards(false);
        } catch (e) {
          els.count.textContent = '加载失败：' + e.message;
          els.grid.innerHTML = '';
        }
      }

      function renderChips() {
        const counts = {};
        state.links.forEach((l) => { counts[l.categoryId] = (counts[l.categoryId] || 0) + 1; });
        const items = [{ id: 'all', name: '全部', n: state.links.length }].concat(
          state.categories.map((c) => ({ id: c.id, name: c.name, n: counts[c.id] || 0 }))
        );
        els.chips.innerHTML = items
          .map((c) => {
            const on = state.active === c.id ? ' on' : '';
            const title = c.id === 'all' ? '' : ' title="双击可重命名"';
            return `<button class="chip${on}" data-id="${esc(c.id)}" type="button"${title}>${esc(c.name)}<span class="n">${c.n}</span></button>`;
          })
          .join('');
        requestAnimationFrame(updateScrollButtons);
      }

      function cardHtml(link, animate) {
        const ch = fallbackChar(link);
        const h = host(link.url);
        const icon = link.icon || (h ? 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(h) + '&sz=128' : '');
        const img = icon
          ? `<img src="${esc(icon)}" alt="" loading="lazy" decoding="async" onerror="this.remove();this.parentNode.querySelector('.fb').style.display='flex'">`
          : '';
        const cat = state.categories.find((c) => c.id === link.categoryId);
        const tags = [
          cat ? `<span class="tag cat">${esc(cat.name)}</span>` : '',
          ...(Array.isArray(link.tags) ? link.tags.map((t) => `<span class="tag">${esc(t)}</span>`) : []),
          link.pinned ? `<span class="tag">置顶</span>` : ''
        ].filter(Boolean).join('');
        return `<div class="card${animate ? ' filter-in' : ''}" data-url="${esc(link.url)}" data-id="${esc(link.id)}" tabindex="0" role="link" draggable="true">
          <div class="ico">${img}<span class="fb" style="${icon ? 'display:none' : 'display:flex'}">${esc(ch)}</span></div>
          <div class="body">
            <div class="t">${esc(link.title || link.url)}</div>
            <div class="d">${esc(h)}</div>
            ${link.description ? `<div class="desc">${esc(link.description)}</div>` : ''}
            <div class="tags">${tags}
              <span class="tools">
                <a class="go" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">直达 →</a>
                <button class="move" type="button" data-id="${esc(link.id)}">移动</button>
                <button class="del" type="button" data-id="${esc(link.id)}">删除</button>
              </span>
            </div>
          </div>
        </div>`;
      }

      function renderCards(animate) {
        const q = state.q.trim().toLowerCase();
        const visible = state.links.filter((l) => {
          if (state.active !== 'all' && l.categoryId !== state.active) return false;
          if (!q) return true;
          return (
            (l.title || '').toLowerCase().includes(q) ||
            (l.url || '').toLowerCase().includes(q) ||
            (l.description || '').toLowerCase().includes(q)
          );
        });

        els.clear.style.display = state.q ? 'block' : 'none';

        const catName =
          state.active === 'all'
            ? '全部'
            : (state.categories.find((c) => c.id === state.active) || {}).name || '';
        els.count.textContent = `${visible.length} 条 · ${catName}`;

        if (!visible.length) {
          els.grid.innerHTML = '';
          els.empty.hidden = false;
          return;
        }

        els.empty.hidden = true;
        els.grid.innerHTML = visible.map((l) => cardHtml(l, animate)).join('');
      }

      // 搜索：实时过滤（唯一允许的过滤动效）
      els.q.addEventListener('input', () => {
        state.q = els.q.value;
        renderCards(state.q.trim().length > 0);
      });

      els.clear.addEventListener('click', () => {
        els.q.value = '';
        state.q = '';
        renderCards(false);
        els.q.focus();
      });

      els.chips.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        state.active = chip.dataset.id || 'all';
        renderChips();
        renderCards(false);
      });

      function updateScrollButtons() {
        const el = els.chips;
        const overflow = el.scrollWidth > el.clientWidth + 2;
        const atStart = el.scrollLeft <= 2;
        const atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
        els.chipsLeft.classList.toggle('show', overflow && !atStart);
        els.chipsRight.classList.toggle('show', overflow && !atEnd);
      }

      function scrollChips(dir) {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const step = Math.max(180, Math.round(els.chips.clientWidth * 0.7));
        els.chips.scrollBy({ left: dir * step, behavior: reduced ? 'auto' : 'smooth' });
      }

      els.chipsLeft.addEventListener('click', () => scrollChips(-1));
      els.chipsRight.addEventListener('click', () => scrollChips(1));
      els.chips.addEventListener('scroll', updateScrollButtons, { passive: true });
      window.addEventListener('resize', updateScrollButtons);

      els.loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = els.pwd.value;
        if (!pwd) return;
        els.loginBtn.disabled = true;
        els.loginErr.textContent = '验证中…';
        try {
          const res = await fetch('/api/storage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-auth-password': pwd },
            body: JSON.stringify({ authOnly: true })
          });
          if (!res.ok) {
            els.loginErr.textContent = res.status === 401 ? '密码错误，请重试' : '验证失败（' + res.status + '）';
            return;
          }
          const data = await res.json();
          state.pwd = pwd;
          state.issued = String(data.authenticatedAt || Date.now());
          localStorage.setItem('cn_pwd', state.pwd);
          localStorage.setItem('cn_pwd_at', state.issued);
          els.loginErr.textContent = '';
          load();
        } catch (err) {
          els.loginErr.textContent = '网络错误：' + err.message;
        } finally {
          els.loginBtn.disabled = false;
        }
      });

      function openCatModal() {
        els.catErr.textContent = '';
        els.catName.value = '';
        els.catModal.hidden = false;
        setTimeout(() => { try { els.catName.focus(); } catch (e) {} }, 30);
      }

      function closeCatModal() {
        els.catModal.hidden = true;
      }

      async function createCategory(name) {
        els.catErr.textContent = '保存中…';
        try {
          if (!state.pwd) {
            const p = prompt('请输入站点密码');
            if (!p) { els.catErr.textContent = ''; return; }
            state.pwd = p;
            localStorage.setItem('cn_pwd', p);
          }
          const res = await fetch('/api/storage', { headers: authHeaders() });
          if (res.status === 401) {
            state.pwd = '';
            localStorage.removeItem('cn_pwd');
            els.catErr.textContent = '密码错误，请重试';
            return;
          }
          if (!res.ok) { els.catErr.textContent = '读取失败：' + res.status; return; }
          const data = await res.json();
          const cats = Array.isArray(data.categories) ? data.categories : [];
          if (cats.some((c) => (c.name || '').trim() === name)) {
            els.catErr.textContent = '同名分类已存在';
            return;
          }
          cats.push({ id: 'cat_' + Date.now().toString(36), name, icon: 'Folder' });
          data.categories = cats;
          const save = await fetch('/api/storage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHeaders() },
            body: JSON.stringify(data)
          });
          if (!save.ok) { els.catErr.textContent = '保存失败：' + save.status; return; }
          state.categories = cats;
          closeCatModal();
          renderChips();
          renderCards(false);
          alert('已创建分类：' + name);
        } catch (e) {
          els.catErr.textContent = '网络错误：' + e.message;
        }
      }

      els.addCatBtn.addEventListener('click', openCatModal);
      els.catCancel.addEventListener('click', closeCatModal);
      els.catForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = els.catName.value.trim();
        if (!name) { els.catErr.textContent = '请输入分类名称'; return; }
        if (name.length > 20) { els.catErr.textContent = '名称最多 20 个字'; return; }
        createCategory(name);
      });

      function openMoveModal(id) {
        const link = state.links.find((l) => l.id === id);
        if (!link) return;
        state.movingId = id;
        els.moveErr.textContent = '';
        els.moveLinkName.textContent = link.title || link.url;
        els.moveTarget.innerHTML = state.categories
          .map((c) => `<option value="${esc(c.id)}"${c.id === link.categoryId ? ' selected' : ''}>${esc(c.name)}</option>`)
          .join('');
        els.moveModal.hidden = false;
        setTimeout(() => { try { els.moveTarget.focus(); } catch (e) {} }, 30);
      }

      function closeMoveModal() {
        els.moveModal.hidden = true;
      }

      async function moveLinkById(id, targetId) {
        if (!id || !targetId) return;
        const useModal = !els.moveModal.hidden;
        const showErr = (m) => { if (useModal) { els.moveErr.textContent = m; } else { alert(m); } };
        if (useModal) els.moveErr.textContent = '保存中…';
        try {
          if (!state.pwd) {
            const p = prompt('请输入站点密码');
            if (!p) { if (useModal) els.moveErr.textContent = ''; return; }
            state.pwd = p;
            localStorage.setItem('cn_pwd', p);
          }
          const res = await fetch('/api/storage', { headers: authHeaders() });
          if (res.status === 401) {
            state.pwd = '';
            localStorage.removeItem('cn_pwd');
            showErr('密码错误，请重试');
            return;
          }
          if (!res.ok) { showErr('读取失败：' + res.status); return; }
          const data = await res.json();
          const link = (data.links || []).find((l) => l.id === id);
          if (!link) { showErr('找不到该链接，请刷新后重试'); return; }
          if (link.categoryId === targetId) { if (useModal) closeMoveModal(); return; }
          link.categoryId = targetId;
          const save = await fetch('/api/storage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHeaders() },
            body: JSON.stringify(data)
          });
          if (!save.ok) { showErr('保存失败：' + save.status); return; }
          const local = state.links.find((l) => l.id === id);
          if (local) local.categoryId = targetId;
          if (useModal) closeMoveModal();
          renderChips();
          renderCards(false);
        } catch (e) {
          showErr('网络错误：' + e.message);
        }
      }

      function moveLink(targetId) {
        moveLinkById(state.movingId, targetId);
      }

      async function deleteLink(id) {
        const link = state.links.find((l) => l.id === id);
        if (!link) return;
        if (!confirm('确认删除「' + (link.title || link.url) + '」？')) return;
        try {
          if (!state.pwd) {
            const p = prompt('请输入站点密码');
            if (!p) return;
            state.pwd = p;
            localStorage.setItem('cn_pwd', p);
          }
          const res = await fetch('/api/storage', { headers: authHeaders() });
          if (res.status === 401) {
            state.pwd = '';
            localStorage.removeItem('cn_pwd');
            alert('密码错误，请重试');
            return;
          }
          if (!res.ok) { alert('读取失败：' + res.status); return; }
          const data = await res.json();
          const before = (data.links || []).length;
          data.links = (data.links || []).filter((l) => l.id !== id);
          if (data.links.length === before) { alert('找不到该链接，请刷新后重试'); return; }
          const save = await fetch('/api/storage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHeaders() },
            body: JSON.stringify(data)
          });
          if (!save.ok) { alert('保存失败：' + save.status); return; }
          state.links = state.links.filter((l) => l.id !== id);
          renderChips();
          renderCards(false);
        } catch (e) {
          alert('网络错误：' + e.message);
        }
      }

      els.moveCancel.addEventListener('click', closeMoveModal);
      els.moveForm.addEventListener('submit', (e) => {
        e.preventDefault();
        moveLink(els.moveTarget.value);
      });

      // 拖拽：把卡片拖到顶部分类标签上即可移动
      els.grid.addEventListener('dragstart', (e) => {
        const card = e.target.closest('.card');
        if (!card) return;
        e.dataTransfer.setData('text/plain', card.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
      });

      els.grid.addEventListener('dragend', () => {
        document.querySelectorAll('.card.dragging').forEach((c) => c.classList.remove('dragging'));
        document.querySelectorAll('.chip.drop-over').forEach((c) => c.classList.remove('drop-over'));
      });

      els.chips.addEventListener('dragover', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip || chip.dataset.id === 'all') return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        chip.classList.add('drop-over');
      });

      els.chips.addEventListener('dragleave', (e) => {
        const chip = e.target.closest('.chip');
        if (chip) chip.classList.remove('drop-over');
      });

      els.chips.addEventListener('drop', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip || chip.dataset.id === 'all') return;
        e.preventDefault();
        chip.classList.remove('drop-over');
        const id = e.dataTransfer.getData('text/plain');
        if (id) moveLinkById(id, chip.dataset.id);
      });

      function openRenameModal(id) {
        const cat = state.categories.find((c) => c.id === id);
        if (!cat) return;
        els.renameErr.textContent = '';
        els.renameName.value = cat.name || '';
        els.renameModal.dataset.id = id;
        els.renameModal.hidden = false;
        setTimeout(() => { try { els.renameName.focus(); els.renameName.select(); } catch (e) {} }, 30);
      }

      function closeRenameModal() {
        els.renameModal.hidden = true;
      }

      async function renameCategory(id, name) {
        els.renameErr.textContent = '保存中…';
        try {
          if (!state.pwd) {
            const p = prompt('请输入站点密码');
            if (!p) { els.renameErr.textContent = ''; return; }
            state.pwd = p;
            localStorage.setItem('cn_pwd', p);
          }
          const res = await fetch('/api/storage', { headers: authHeaders() });
          if (res.status === 401) {
            state.pwd = '';
            localStorage.removeItem('cn_pwd');
            els.renameErr.textContent = '密码错误，请重试';
            return;
          }
          if (!res.ok) { els.renameErr.textContent = '读取失败：' + res.status; return; }
          const data = await res.json();
          const cats = Array.isArray(data.categories) ? data.categories : [];
          if (cats.some((c) => c.id !== id && (c.name || '').trim() === name)) {
            els.renameErr.textContent = '已有同名分类';
            return;
          }
          const cat = cats.find((c) => c.id === id);
          if (!cat) { els.renameErr.textContent = '找不到该分类，请刷新后重试'; return; }
          cat.name = name;
          data.categories = cats;
          const save = await fetch('/api/storage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHeaders() },
            body: JSON.stringify(data)
          });
          if (!save.ok) { els.renameErr.textContent = '保存失败：' + save.status; return; }
          state.categories = cats;
          closeRenameModal();
          renderChips();
          renderCards(false);
        } catch (e) {
          els.renameErr.textContent = '网络错误：' + e.message;
        }
      }

      els.chips.addEventListener('dblclick', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        if (chip.dataset.id === 'all') return;
        openRenameModal(chip.dataset.id);
      });

      els.renameCancel.addEventListener('click', closeRenameModal);
      els.renameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = els.renameName.value.trim();
        if (!name) { els.renameErr.textContent = '请输入名称'; return; }
        if (name.length > 20) { els.renameErr.textContent = '名称最多 20 个字'; return; }
        renameCategory(els.renameModal.dataset.id, name);
      });

      async function deleteCategory(id) {
        const cat = state.categories.find((c) => c.id === id);
        if (!cat) return;
        const n = state.links.filter((l) => l.categoryId === id).length;
        if (n > 0) {
          els.renameErr.textContent = '该分类下还有 ' + n + ' 条书签，请先移到其他分类';
          return;
        }
        if (!confirm('确认删除分类「' + cat.name + '」？')) return;
        els.renameErr.textContent = '删除中…';
        try {
          if (!state.pwd) {
            const p = prompt('请输入站点密码');
            if (!p) { els.renameErr.textContent = ''; return; }
            state.pwd = p;
            localStorage.setItem('cn_pwd', p);
          }
          const res = await fetch('/api/storage', { headers: authHeaders() });
          if (res.status === 401) {
            state.pwd = '';
            localStorage.removeItem('cn_pwd');
            els.renameErr.textContent = '密码错误，请重试';
            return;
          }
          if (!res.ok) { els.renameErr.textContent = '读取失败：' + res.status; return; }
          const data = await res.json();
          const linked = (data.links || []).filter((l) => l.categoryId === id).length;
          if (linked > 0) {
            els.renameErr.textContent = '该分类下还有 ' + linked + ' 条书签，请先移走';
            return;
          }
          data.categories = (data.categories || []).filter((c) => c.id !== id);
          const save = await fetch('/api/storage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHeaders() },
            body: JSON.stringify(data)
          });
          if (!save.ok) { els.renameErr.textContent = '保存失败：' + save.status; return; }
          state.categories = data.categories;
          if (state.active === id) state.active = 'all';
          closeRenameModal();
          renderChips();
          renderCards(false);
        } catch (e) {
          els.renameErr.textContent = '网络错误：' + e.message;
        }
      }

      els.renameDelete.addEventListener('click', () => deleteCategory(els.renameModal.dataset.id));

      els.grid.addEventListener('click', (e) => {
        const del = e.target.closest('.del');
        if (del) { deleteLink(del.dataset.id); return; }
        const mv = e.target.closest('.move');
        if (mv) { openMoveModal(mv.dataset.id); return; }
        if (e.target.closest('a')) return;
        const card = e.target.closest('.card');
        if (card && card.dataset.url) window.open(card.dataset.url, '_blank', 'noopener');
      });

      els.grid.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        if (e.target.closest('a,button')) return;
        const card = e.target.closest('.card');
        if (card && card.dataset.url) { e.preventDefault(); window.open(card.dataset.url, '_blank', 'noopener'); }
      });

      els.exportBtn.addEventListener('click', async () => {
        try {
          const res = await fetch('/api/storage', { headers: authHeaders() });
          if (res.status === 401) { showLogin('密码错误或已过期，请重新输入'); return; }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const payload = { links: data.links || [], categories: data.categories || [], exportedAt: new Date().toISOString() };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          const d = new Date();
          const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          a.href = URL.createObjectURL(blob);
          a.download = (els.brand.textContent || 'bookmarks').replace(/\s+/g, '-') + '-' + stamp + '.json';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        } catch (err) {
          alert('导出失败：' + err.message);
        }
      });

      (async function init() {
        try {
          const r = await fetch('/api/storage?getConfig=website');
          if (r.ok) {
            const cfg = await r.json();
            const name = cfg.navTitle || cfg.title;
            if (name) { els.brand.textContent = name; document.title = cfg.title || name; }
          }
        } catch (e) {}

        let requiresAuth = false;
        try {
          const r = await fetch('/api/storage?checkAuth=true');
          if (r.ok) {
            const j = await r.json();
            requiresAuth = !!j.requiresAuth;
          }
        } catch (e) {}

        if (requiresAuth && !state.pwd) {
          showLogin('');
          return;
        }
        load();
      })();
    </script>
  </body>
</html>
